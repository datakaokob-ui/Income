<!-- HEADER -->
<header class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">

  <div class="relative flex items-center justify-between gap-4">

    <!-- ซ้าย -->
    <div class="flex-1">
      <h1 class="text-2xl font-bold text-slate-800">
        🏡 บัญชีรายรับ-รายจ่าย
      </h1>

      <p class="text-slate-500 text-sm mt-1">
        ผู้ใช้งาน:
        <span id="userEmailTag"
              class="font-semibold text-blue-600"></span>
      </p>
    </div>

    <!-- นาฬิกา ตรงกลาง -->
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
      <div class="analog-clock" id="analogClock">

        <span class="clock-number n12">12</span>
        <span class="clock-number n3">3</span>
        <span class="clock-number n6">6</span>
        <span class="clock-number n9">9</span>

        <div class="clock-hand hour-hand" id="hourHand"></div>
        <div class="clock-hand minute-hand" id="minuteHand"></div>
        <div class="clock-hand second-hand" id="secondHand"></div>

        <div class="clock-center"></div>
      </div>
    </div>

    <!-- ขวา -->
    <div class="flex gap-2 flex-1 justify-end">
      <button onclick="exportToPDF()"
        class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg text-sm font-medium transition">
        📄 สรุป PDF
      </button>

      <button onclick="handleLogout()"
        class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-3 py-2 rounded-lg text-sm font-medium transition">
        🚪 ออกจากระบบ
      </button>
    </div>

  </div>

</header>
